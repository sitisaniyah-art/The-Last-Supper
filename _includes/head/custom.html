<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
<script src="https://unpkg.com/pinyin-pro@3.26.0/dist/pinyin-pro.umd.min.js" crossorigin="anonymous"></script>
<link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}">
<script>
(function(){
  var t=localStorage.getItem('theme');
  if(t==='dark') document.documentElement.setAttribute('data-theme','dark');
})();
</script>
<!-- Service Worker registration -->
<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('{{ "/sw.js" | relative_url }}').catch(function(e){console.log('SW registration failed:',e)});
}
</script>
<!-- Places index for site-wide search agent -->
<script>
var tlsPlacesIndex=[
{% for p in site.data.zju-fun %}
{"id":{{ p.id }},"name":"{{ p.name | escape }}","category":"{{ p.category }}","rating":{{ p.rating }},"address":"{{ p.address | escape }}","description":"{{ p.description | escape }}","tags":{{ p.tags | jsonify }}}{% unless forloop.last %},{% endunless %}
{% endfor %}
];
</script>
