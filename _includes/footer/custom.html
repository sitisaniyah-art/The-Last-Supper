<div style="text-align: center; margin-top: 2rem; padding: 1.5rem; border-top: 1px solid var(--border-subtle);">
  <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 0.75rem;">
    <a href="https://github.com/sitisaniyah-art/The-Last-Supper" target="_blank" rel="noopener" style="color: var(--text-secondary);">
      <i class="fab fa-github"></i> GitHub
    </a>
    &nbsp;·&nbsp;
    <a href="{{ '/contribute/' | relative_url }}" style="color: var(--text-secondary);">
      <i class="fas fa-hands-helping"></i> 贡献资源
    </a>
    &nbsp;·&nbsp;
    <a href="{{ '/guide/' | relative_url }}" style="color: var(--text-secondary);">
      <i class="fas fa-book"></i> 使用指南
    </a>
  </p>
  <button id="dark-mode-toggle" aria-label="切换暗黑模式" style="background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:var(--radius-full);padding:8px 16px;cursor:pointer;font-size:0.85rem;color:var(--text-secondary);transition:all 0.3s ease;">
    <i class="fas fa-moon"></i> 暗黑模式
  </button>
  <p style="color: var(--text-muted); font-size: 0.75rem; margin-top: 0.75rem;">
    © 2026 最后的晚餐 · 学习资源互助社区
  </p>
</div>
<script>
(function(){
  var btn=document.getElementById('dark-mode-toggle');
  if(!btn) return;
  function update(){
    var dark=document.documentElement.getAttribute('data-theme')==='dark';
    btn.innerHTML=dark?'<i class="fas fa-sun"></i> 明亮模式':'<i class="fas fa-moon"></i> 暗黑模式';
  }
  update();
  btn.addEventListener('click',function(){
    var dark=document.documentElement.getAttribute('data-theme')==='dark';
    if(dark){
      document.documentElement.removeAttribute('data-theme');
      localStorage.setItem('theme','light');
    }else{
      document.documentElement.setAttribute('data-theme','dark');
      localStorage.setItem('theme','dark');
    }
    update();
  });
})();
</script>
